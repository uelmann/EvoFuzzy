# FuzzyX prototype — not a trained book. Does not replace COMBO / A0.
# Design: reports/fuzzyx_architecture.md
seed: 42

universe:
  source: cmc
  n: 30
  rank: volume          # trailing 30d median dollar volume; fallback mcap
  rank_alt: mcap
  exclude_stables_wraps: true

rebalance:
  days: 7               # first experiment; daily is the ablation
  hold: ffill

features:
  source: baseline.features.FEATURE_COLS   # identical A0 LightGBM inputs, no extras
  n: 33
  zscore_clip: 5.0
  min_history_days: 100

model:
  n_mfs: 3              # Low / Mid / High Gaussians
  n_rules: 24
  encoder: deepsets     # default. xsec = 1-layer asset-token attention
  d_model: 32
  n_heads: 4
  n_layers: 1
  gate_temperature: 0.5
  pos_temperature: 0.7
  complex_cfs: false    # notebook CFS phase is a later ablation, off

loss:
  core: trend_corr * (1 - maxdd) * (1 - ddur)
  # v1b: occupancy floors are diagnostics only — do not force always-in-market
  occ_nuke: false
  occ_lambda: 0.0
  active_lambda: 0.20      # pay-to-play on mean σ((|pos|−0.05)/0.05)
  flat_init_bias: 1.5
  occ_long_min: 0.20       # reported, not used in train
  occ_short_min: 0.30
  occ_traded_min: 0.25
  occ_penalty: 1.0e5
  turn_lambda: 0.05
  bias_lambda: 0.05
  # w = p / max(Σ|p|, 1) — no lever-up of dust into a 100% book

portfolio:
  gross_limit: 1.0
  taker_fee_bps: 5.0
  slippage_bps: 3.0
  actions: [-1, 0, 1]

cv:
  min_train_days: 730
  val_days: 90
  step_days: 90
  purge_horizon: 7
  embargo_extra: 3
  inner_holdout_days: 90

train:
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 80
  patience: 12
  encoder: deepsets

